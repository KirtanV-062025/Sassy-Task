{% extends "base.html" %}

{% block title %}Calculator{% endblock %}

{% block content %}
<div class="calculate">
    <h1>Calculate</h1>

    <form id="calc-form">
        <input type="text" name="first_number" placeholder="First Number" required />
        <input type="text" name="second_number" placeholder="Second Number" required />
        <input type="text" name="operation" placeholder="Operation (add, sub, mul, div)" required />
        <button type="submit" class="btn btn-primary btn-block btn-large">Calculate</button>
    </form>

    <br>
    Answer is: <span id="score">--</span>
    <br>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("calc-form").addEventListener("submit", function(event) {
    event.preventDefault();

    const form = event.target;
    const data = {
        first_number: form.first_number.value,
        second_number: form.second_number.value,
        operation: form.operation.value
    };

    fetch('/calculate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(data => {
        const scoreEl = document.getElementById("score");
        if (data.answer !== undefined) {
            scoreEl.textContent = data.answer;
        } else {
            scoreEl.textContent = data.error || "Error occurred.";
        }
    })
    .catch(err => {
        document.getElementById("score").textContent = "Error calculating.";
        console.error(err);
    });
});
</script>
{% endblock %}
