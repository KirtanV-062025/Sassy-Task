

{% extends "base.html" %}
{% block title %}AI Chatbot{% endblock %}

{% block content %}
<!-- Chat toggle button -->
<div id="chatToggle">
  💬
</div>

<!-- Chat sidebar -->
<div id="chatSidebar" class="closed">
  <div id="chatHeader">
    <strong>AI Chatbot</strong>
    <span id="closeChat">&times;</span>
  </div>
  <div id="chatMessages"></div>
  <div id="chatInputContainer">
    <input type="text" id="chatInput" placeholder="Type a message..." />
    <button id="sendBtn">➤</button>
  </div>
</div>

<script>
  const toggleBtn = document.getElementById('chatToggle');
  const sidebar = document.getElementById('chatSidebar');
  const closeBtn = document.getElementById('closeChat');
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const messagesDiv = document.getElementById('chatMessages');

  let history = [];

  toggleBtn.onclick = () => sidebar.classList.remove('closed');
  closeBtn.onclick = () => sidebar.classList.add('closed');

  function addMessage(role, content) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + role;
    bubble.innerHTML = content;
    messagesDiv.appendChild(bubble);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  async function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    addMessage('user', message);
    history.push({ role: 'user', content: message });
    input.value = '';

    addMessage('assistant', 'Typing...', true);

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, history })
      });

      const data = await res.json();
      messagesDiv.lastChild.remove();
      addMessage('assistant', data.reply);
      history.push({ role: 'assistant', content: data.reply });
    } catch {
      messagesDiv.lastChild.remove();
      addMessage('assistant', 'Error: could not reach server.');
    }
  }

  sendBtn.onclick = sendMessage;
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });
</script>

<style>
  #chatToggle {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: #444;
    color: white;
    border-radius: 50%;
    padding: 12px 14px;
    font-size: 22px;
    cursor: pointer;
    z-index: 1000;
  }

  #chatSidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 320px;
    height: 100%;
    background: #2c2f36;
    color: white;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease;
    z-index: 1000;
  }

  #chatSidebar.closed {
    transform: translateX(-100%);
  }

  #chatHeader {
    padding: 15px;
    font-size: 18px;
    border-bottom: 1px solid #444;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #closeChat {
    cursor: pointer;
    font-size: 20px;
    color: #aaa;
  }

  #chatMessages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
  }

  .bubble {
    max-width: 80%;
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    word-wrap: break-word;
  }

  .user {
    background: #4a90e2;
    color: white;
    align-self: flex-end;
    margin-left: auto;
  }

  .assistant {
    background: #3c3f47;
    color: #eee;
    align-self: flex-start;
    margin-right: auto;
  }

  #chatInputContainer {
    display: flex;
    padding: 10px;
    border-top: 1px solid #444;
  }

  #chatInput {
    flex: 1;
    padding: 10px;
    border: none;
    background: #1f2229;
    color: white;
    border-radius: 10px;
    font-size: 15px;
    margin-right: 5px;
  }

  #chatInput:focus {
    outline: none;
  }

  #sendBtn {
    background: #4a90e2;
    color: white;
    border: none;
    padding: 10px 14px;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
  }
</style>
{% endblock %}
